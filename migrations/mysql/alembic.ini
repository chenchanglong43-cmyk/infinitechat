# Alembic configuration
[alembic]
# Directory where migration scripts live
script_location = %(here)s
# Add this directory to Python import path
prepend_sys_path = .
# Separator between multiple paths
path_separator = os

# Loggers
[loggers]
# Logger names
keys = root,sqlalchemy,alembic

# Handlers
[handlers]
# Handler names
keys = console

# Formatters
[formatters]
# Formatter names
keys = generic

# logger_root
[logger_root]
# Log level
level = WARN
# Handlers to use
handlers = console
# Logger name
qualname =

# logger_sqlalchemy
[logger_sqlalchemy]
# Log level
level = WARN
# Handlers to use
handlers =
# Logger name
qualname = sqlalchemy.engine

# logger_alembic
[logger_alembic]
# Log level
level = INFO
# Handlers to use
handlers =
# Logger name
qualname = alembic

# handler_console
[handler_console]
# Handler class
class = StreamHandler
# Handler arguments
args = (sys.stderr,)
# Log level
level = NOTSET
# Formatter to use
formatter = generic

# formatter_generic
[formatter_generic]
# Log format
format = %(levelname)-5.5s [%(name)s] %(message)s
# Date format
datefmt = %H:%M:%S
