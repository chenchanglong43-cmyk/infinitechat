[project]
name = "infinitechat-foundation"
version = "0.1.0"
description = "Minimal runtime foundation shared by InfiniteChat services"
requires-python = ">=3.13.14"
dependencies = [
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "structlog>=25,<27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["infinitechat"]
