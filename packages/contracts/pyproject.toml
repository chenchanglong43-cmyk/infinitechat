[project]
name = "infinitechat-contracts"
version = "0.1.0"
description = "Transport contracts shared by InfiniteChat services"
requires-python = ">=3.13.14"
dependencies = [
    "email-validator>=2.2,<3",
    "pydantic>=2.11,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["infinitechat"]
