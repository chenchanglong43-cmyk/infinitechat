[project]
name = "infinitechat-user-service"
version = "0.1.0"
description = "InfiniteChat user, contact and session service"
requires-python = ">=3.13.14"
dependencies = [
    "infinitechat-foundation",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["user_service"]

[tool.uv.sources]
infinitechat-foundation = { workspace = true }
