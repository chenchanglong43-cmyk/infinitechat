[project]
name = "infinitechat-user-service"
version = "0.1.0"
description = "InfiniteChat user, contact and session service"
requires-python = ">=3.13.14"
dependencies = [
    "aiokafka>=0.14,<0.15",
    "aiosmtplib>=5.1.1,<6",
    "argon2-cffi>=25,<26",
    "asyncmy>=0.2.10,<1",
    "cryptography>=43",
    "fastapi>=0.116,<1",
    "infinitechat-contracts",
    "infinitechat-foundation",
    "minio>=7.2,<8",
    "python-multipart>=0.0.20,<1",
    "redis>=8,<9",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uvicorn[standard]>=0.35,<1",
]

[project.scripts]  # 命令行入口: 命令名 = 模块:函数
infinitechat-user-api = "user_service.entrypoints:api_main"  # 命令 infinitechat-user-api: 运行 user_service 的 api_...
# 命令 infinitechat-user-worker: 运行 user_service 的 w...
infinitechat-user-worker = "user_service.entrypoints:worker_main"
# 命令 infinitechat-user-scheduler: 运行 user_service...
infinitechat-user-scheduler = "user_service.entrypoints:scheduler_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["user_service"]

[tool.uv.sources]  # 这些依赖从工作区里取, 不去 PyPI 下载
infinitechat-contracts = { workspace = true }  # 契约包从工作区取
infinitechat-foundation = { workspace = true }  # 基础库从工作区取
