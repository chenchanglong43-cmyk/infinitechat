[project]  # 项目基本信息
name = "infinitechat-workspace"  # 包名
version = "0.1.0"  # 版本号: 0.1.0
description = "InfiniteChat Python P0 workspace"  # 一句话描述
requires-python = "==3.13.*"  # 要求的 Python 版本: ==3.13.*
dependencies = [
    "tzdata>=2026.6",
]  # 运行时依赖: []

[tool.uv]  # uv 的设置
package = false  # 是否把根目录当成包: false

[tool.uv.workspace]  # uv 工作区: 下面这些目录都是成员
members = [  # 工作区成员目录
    "packages/contracts",  # 成员: 契约
    "packages/foundation",  # 成员: 基础库
    "services/user_service",
    "services/gateway",
    "services/realtime_service",
    "services/red_packet_service",  # 成员: 用户服务
]  # 列表结束

[dependency-groups]
dev = [
    "alembic>=1.16,<2",
]
